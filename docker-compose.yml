services:
  postgres:
    image: postgres:16-alpine
    container_name: riskshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riskshield_db}
      POSTGRES_USER: ${POSTGRES_USER:-riskshield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskshield_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskshield_user} -d ${POSTGRES_DB:-riskshield_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
