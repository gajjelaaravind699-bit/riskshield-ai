services:
  postgres:
    image: postgres:16-alpine
    container_name: riskshield-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riskshield_db}
      POSTGRES_USER: ${POSTGRES_USER:-riskshield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be provided}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskshield_user} -d ${POSTGRES_DB:-riskshield_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - riskshield-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riskshield-backend-prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Error: SECRET_KEY must be provided}
      AUTH_ENABLED: "true"
      API_KEYS: ${API_KEYS:?Error: API_KEYS must be configured in production}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-riskshield_db}
      POSTGRES_USER: ${POSTGRES_USER:-riskshield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_ENABLED: "true"
      LOG_FORMAT: json
      LOG_LEVEL: INFO
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - riskshield-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: riskshield-frontend-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - riskshield-network

networks:
  riskshield-network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
